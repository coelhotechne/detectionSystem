# item 26/32 ? limiar de diagnóstico e debounce de escrita
sensor.diagnostics.data-transfer-out-of-spec=95
sensor.diagnostics.heartbeat-write-interval=60s

# item 12 ? janela do scanner (>= 3x o heartbeat acima)
sensor.inactivity.window=5m
sensor.inactivity.scan-interval-ms=30000

# itens 18/23/24/25 ? broker
sensor.mqtt.broker-url=ssl://broker.interno:8883
sensor.mqtt.client-id=detection-system
sensor.mqtt.username=detection-system
sensor.mqtt.password=${MQTT_PASSWORD}
sensor.mqtt.clean-session=false
sensor.mqtt.unique-client-id-suffix=false
sensor.mqtt.ingestion-threads=4
sensor.mqtt.ingestion-queue-capacity=5000

# item 15 ? garante snake_case independente da geração do Jackson ativa
spring.jackson.property-naming-strategy=SNAKE_CASE